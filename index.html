<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <link rel="stylesheet" href="style.css" />
    <title>Results summary component</title>
  </head>
  <body>
    <main>
      <!--This is the container holding all the elements | Wrapper -->
      <section id="container">
        <!--The Gradient Part Container-->
        <div class="blue__container">
          <h1>Your Result</h1>
          <div class="circle__bg">
            <h2>76</h2>
            <p>of 100</p>
          </div>

          <div class="info__sec">
            <h4>Great</h4>
            <p>
              You scored higher than 65% of the people who have taken these
              tests.
            </p>
          </div>
        </div>

        <!--The Light Part Container-->
        <div class="light__container">
          <h3>Summary</h3>
          <ul>
            <!-- Reaction Container -->
            <li class="wrapper" id="reaction__bg">
              <div class="left__side">
                <img
                  src="assets/images/icon-reaction.svg"
                  alt="reaction icon"
                />
                <p>Reaction</p>
              </div>

              <div class="right__side">
                <p class="score"><strong>80</strong> <span> / 100</span></p>
              </div>
            </li>

            <!-- Memory Container -->
            <li class="wrapper" id="memory__bg">
              <div class="left__side">
                <img src="assets/images/icon-memory.svg" alt="memory icon" />
                <p>Memory</p>
              </div>

              <div class="right__side">
                <p class="score"><strong>92</strong> <span> / 100</span></p>
              </div>
            </li>

            <!-- Verbal Container -->
            <li class="wrapper" id="verbal__bg">
              <div class="left__side">
                <img src="assets/images/icon-verbal.svg" alt="memory icon" />
                <p>Verbal</p>
              </div>

              <div class="right__side">
                <p class="score"><strong>61</strong> <span> / 100</span></p>
              </div>
            </li>

            <!-- Visual Container -->
            <li class="wrapper" id="visual__bg">
              <div class="left__side">
                <img src="assets/images/icon-visual.svg" alt="memory icon" />
                <p>Visual</p>
              </div>

              <div class="right__side">
                <p class="score"><strong>73</strong> <span> / 100</span></p>
              </div>
            </li>
          </ul>

          <!--button box-->
          <button class="btn__continue">Continue</button>
        </div>
      </section>
    </main>

    <footer class="attribution">
      <p>coded by <a href="https://github.com/Squarebitz">Unscarthed</a></p>
    </footer>
  </body>
</html>
